<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reto 02 - Perfil Profesional</title>
  <!-- Integración de Bootstrap 5 vía CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        
        <!-- Contenedor de la tarjeta con sombra -->
        <div class="card shadow-lg border-0 overflow-hidden">
          <div class="row g-0">
            
            <!-- Zona de la Imagen (4 columnas en md, 12 en móvil) -->
            <div class="col-12 col-md-4 d-flex align-items-center justify-content-center">
            <img src="img/usuario.png" class="img-fluid" alt="Foto de perfil">
            </div>

            <!-- Zona de Datos (8 columnas en md, 12 en móvil) -->
            <div class="col-12 col-md-8">
              <div class="card-body p-4">
                <h3 class="card-title fw-bold text-primary">María Lourdes Huanay Estrada</h3>
                <p class="text-muted mb-1">Desarrolladora de Sistemas de Información</p>
                <hr>
                <p class="card-text">
                  Especialista en maquetación web con <strong>HTML5 y CSS3</strong>. 
                  Enfocada en la creación de interfaces modernas y adaptativas bajo los estándares de Bootstrap 5.
                </p>
                
                <!-- Lista de habilidades (Requisito de contenido) -->
                <ul class="list-inline mb-4">
                  <li class="list-inline-item badge bg-info text-dark">Diseño Web</li>
                  <li class="list-inline-item badge bg-info text-dark">Base de Datos</li>
                  <li class="list-inline-item badge bg-info text-dark">PHP</li>
                </ul>

                <div class="d-grid gap-2">
                  <button class="btn btn-primary fw-bold">CONTACTAR AHORA</button>
                </div>
              </div>
            </div>

          </div> 
        </div> 

      </div>
    </div>
  </div>

  <!-- JavaScript necesario para componentes interactivos -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
